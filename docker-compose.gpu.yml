# ─────────────────────────────────────────────────────────────────────────────
# ai-stack — GPU compose file (NVIDIA, incl. Blackwell / RTX 50xx)
#
#   Used by:  profiles/poc-wsl   WSL2 · 16 CPU / 32 GB · Blackwell 8 GB
#   CPU twin: docker-compose.cpu.yml (same services, CPU model)
#
#   VS Code ──► :4000 LiteLLM ──┬──► llm-coder        (GPU + RAM, MoE split by --fit)
#          └──► :8642 Hermes ──┘└──► llm-autocomplete (GPU, small FIM model)
#                 └──► Hindsight ──► Postgres + pgvector ◄── LiteLLM
#
# Every service except llm-coder runs with the VPS limits, so the PoC also
# proves the stack fits the VPS. Model tuning: profiles/<profile>/llm-*.env.
# Keep the shared services identical to the CPU file: scripts/check-compose.sh
# ─────────────────────────────────────────────────────────────────────────────

name: ai-stack

networks:
  ai:
    name: ai-stack

services:
  # ── Persistence ────────────────────────────────────────────────────────────
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    container_name: ai-postgres
    restart: unless-stopped
    # Tuned for a 512 MB container (Postgres defaults assume a whole machine)
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=48MB
      - -c
      - max_connections=40
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_maintenance_workers=1
      - -c
      - wal_buffers=4MB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/bootstrap.sh}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?run scripts/bootstrap.sh}
      HINDSIGHT_DB_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?run scripts/bootstrap.sh}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 64m
    ports:
      - "127.0.0.1:5432:5432"   # local admin only (psql, DBeaver). Never exposed.
    deploy:
      resources:
        limits:
          cpus: "${PG_CPUS:-0.5}"
          memory: ${PG_MEM:-512m}
    memswap_limit: ${PG_MEM:-512m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ai]

  # ── Local models on the GPU (tuning via profiles/<profile>/llm-*.env) ──────
  llm-coder:
    # CUDA 12.8 build: includes Blackwell (sm_120) kernels. Needs Windows driver >= R570.
    # If the log says "no kernel image is available", use ...:server-cuda13.
    image: ${LLAMACPP_GPU_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: ai-llm-coder
    restart: unless-stopped
    env_file:
      - profiles/${STACK_PROFILE:?run scripts/bootstrap.sh --profile <vps|poc-wsl>}/llm-coder.env
    environment:
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      HF_TOKEN: ${HF_TOKEN:-}
      # Required key for every request (LiteLLM here and on the VPS send it).
      LLAMA_API_KEY: ${CODER_API_KEY:-}
    volumes:
      - ./data/models:/root/.cache
    ports:
      # 127.0.0.1 by default. `bootstrap.sh --serve-vps` sets the Tailscale IP.
      - "${CODER_BIND:-127.0.0.1}:${CODER_PORT:-8080}:8080"
    # Start after autocomplete so --fit sizes the coder around the VRAM it uses
    depends_on:
      llm-autocomplete:
        condition: service_healthy
    # The one uncapped service: GPU + the RAM its MoE experts need.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # /health is exempt from LLAMA_API_KEY, so this keeps working with a key set
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 120          # first boot downloads the model
      start_period: 60s
    networks: [ai]

  llm-autocomplete:
    image: ${LLAMACPP_GPU_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: ai-llm-autocomplete
    restart: unless-stopped
    env_file:
      - path: profiles/${STACK_PROFILE}/llm-autocomplete.env
        required: false      # only GPU profiles ship one
    environment:
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      HF_TOKEN: ${HF_TOKEN:-}
      LLAMA_API_KEY: ${CODER_API_KEY:-}
    volumes:
      - ./data/models:/root/.cache
    ports:
      # Same bind as llm-coder: 127.0.0.1, or the Tailscale IP with --serve-vps
      - "${CODER_BIND:-127.0.0.1}:${AUTOCOMPLETE_PORT:-8081}:8080"
    deploy:
      resources:
        limits:
          cpus: "${AUTOCOMPLETE_CPUS:-0.5}"
          memory: ${AUTOCOMPLETE_MEM:-512m}
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    memswap_limit: ${AUTOCOMPLETE_MEM:-512m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks: [ai]

  # ── Routing & management ───────────────────────────────────────────────────
  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-stable}
    container_name: ai-litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # One worker: a small team doesn't need more, and each worker is ~300 MB
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?run scripts/bootstrap.sh}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?run scripts/bootstrap.sh}
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD}
      STORE_MODEL_IN_DB: "False"     # config.yaml in git is the source of truth
      # Routes (litellm/config.yaml). Defaults = the local llm-coder server.
      CODER_MODEL: ${CODER_MODEL:-openai/coder}
      CODER_API_BASE: ${CODER_API_BASE:-http://llm-coder:8080/v1}
      CODER_API_KEY: ${CODER_API_KEY:-none}
      AUTOCOMPLETE_MODEL: ${AUTOCOMPLETE_MODEL:-text-completion-openai/autocomplete}
      AUTOCOMPLETE_API_BASE: ${AUTOCOMPLETE_API_BASE:-http://llm-coder:8080/v1}
      AUTOCOMPLETE_API_KEY: ${AUTOCOMPLETE_API_KEY:-${CODER_API_KEY:-none}}
      MEMORY_MODEL: ${MEMORY_MODEL:-openai/memory}
      MEMORY_API_BASE: ${MEMORY_API_BASE:-http://llm-coder:8080/v1}
      MEMORY_API_KEY: ${MEMORY_API_KEY:-${CODER_API_KEY:-none}}
      HERMES_API_KEY: ${HERMES_API_KEY}     # for the hermes-agent route
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "${LAN_BIND:-127.0.0.1}:${LITELLM_PORT:-4000}:4000"
    deploy:
      resources:
        limits:
          cpus: "${LITELLM_CPUS:-0.5}"
          memory: ${LITELLM_MEM:-768m}
    memswap_limit: ${LITELLM_MEM:-768m}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [ai]

  # ── Memory ─────────────────────────────────────────────────────────────────
  hindsight:
    image: ${HINDSIGHT_IMAGE:-ghcr.io/vectorize-io/hindsight:latest}
    container_name: ai-hindsight
    restart: unless-stopped
    stop_grace_period: 75s
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${HINDSIGHT_DB_PASSWORD}@postgres:5432/hindsight
      # Hindsight's own LLM calls (fact extraction, reflection) go through LiteLLM
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_BASE_URL: http://litellm:4000/v1
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_LLM_API_KEY:-pending}
      HINDSIGHT_API_LLM_MODEL: memory
      # Embeddings + reranker run in-container on CPU (~1.0-1.5 GB RSS).
      # One thread each so they stay inside their CPU cap.
      HINDSIGHT_API_EMBEDDINGS_LOCAL_FORCE_CPU: "true"
      HINDSIGHT_API_RERANKER_LOCAL_FORCE_CPU: "true"
      HINDSIGHT_API_EMBEDDINGS_LOCAL_MAX_CONCURRENT: "1"
      HINDSIGHT_API_RERANKER_LOCAL_MAX_CONCURRENT: "1"
      HINDSIGHT_API_DB_POOL_MAX_SIZE: "6"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    ports:
      - "127.0.0.1:9999:9999"   # Hindsight control-plane UI (browse/edit memories)
    deploy:
      resources:
        limits:
          cpus: "${HINDSIGHT_CPUS:-1.0}"
          memory: ${HINDSIGHT_MEM:-2048m}
    memswap_limit: ${HINDSIGHT_MEM:-2048m}
    networks: [ai]

  # ── Orchestration ──────────────────────────────────────────────────────────
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:stable}
    container_name: hermes
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
      hindsight:
        condition: service_started
    command: ["gateway", "run"]
    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      # OpenAI-compatible API server (what VS Code clients talk to)
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:?run scripts/bootstrap.sh}
      API_SERVER_MODEL_NAME: hermes-agent
      # Key Hermes uses to call LiteLLM (referenced by key_env in config.yaml)
      HERMES_LLM_API_KEY: ${HERMES_LLM_API_KEY:-pending}
      HINDSIGHT_API_URL: http://hindsight:8888
    volumes:
      - ./data/hermes:/opt/data
      # Same absolute path inside and outside → paths line up with VS Code
      - ${WORKSPACE_DIR}:${WORKSPACE_DIR}
    ports:
      # Direct Hermes API. Clients can use LiteLLM's `hermes-agent` model
      # instead; set HERMES_BIND=127.0.0.1 to keep this port local.
      - "${HERMES_BIND:-127.0.0.1}:${HERMES_API_PORT:-8642}:8642"
    # Hermes runs the agent's shell commands (builds, tests, git) in here.
    deploy:
      resources:
        limits:
          cpus: "${HERMES_CPUS:-2.0}"
          memory: ${HERMES_MEM:-3072m}
          pids: 1024           # stops a runaway fork bomb from the agent's shell
    memswap_limit: ${HERMES_MEM:-3072m}
    networks: [ai]
