# CPU-only override (no NVIDIA GPU, or for testing the wiring).
#   docker compose -f docker-compose.yml -f compose.cpu.yml up -d
# Drops only the GPU reservations: the resource limits still apply.
# llm-coder stays unbounded and will use all the CPU it can get; expect
# ~5-15 tok/s on the 30B-A3B MoE. Autocomplete on 0.5 CPU is slow: raise
# AUTOCOMPLETE_CPUS (and lower another service) or turn it off in the editor.
services:
  llm-coder:
    image: ghcr.io/ggml-org/llama.cpp:server
    deploy:
      resources:
        reservations: !reset {}
  llm-autocomplete:
    image: ghcr.io/ggml-org/llama.cpp:server
    deploy:
      resources:
        reservations: !reset {}
