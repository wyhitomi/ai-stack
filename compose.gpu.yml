# GPU override for the poc-wsl profile (NVIDIA, incl. Blackwell / RTX 50xx).
# The default `server-cuda` image is built with CUDA 12.8, which includes
# Blackwell (sm_120) kernels. It needs a Windows NVIDIA driver >= R570.
# If you see "no kernel image is available", try LLAMACPP_GPU_IMAGE=...:server-cuda13.
services:
  llm-autocomplete:
    image: ${LLAMACPP_GPU_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  llm-coder:
    image: ${LLAMACPP_GPU_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    # Start after autocomplete so --fit sizes the coder around the VRAM it uses
    environment:
      # Optional: lets a VPS use this GPU for its `coder` route (docs/deploy-vps.md).
      # llama-server refuses requests without this key once it is set.
      LLAMA_API_KEY: ${CODER_API_KEY:-}
    ports:
      # 127.0.0.1 by default. Set CODER_BIND to this machine's Tailscale IP to serve a VPS.
      - "${CODER_BIND:-127.0.0.1}:${CODER_PORT:-8080}:8080"
    depends_on:
      llm-autocomplete:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
